name: Update FBS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Load cached FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/ffmpeg
            /usr/local/bin/ffprobe
          key: ${{ runner.os }}-ffmpeg-6.0.1

      - name: Install FFmpeg if not cached
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          VERSION=6.0.1
          RELEASE_NAME=ffmpeg-${VERSION}-amd64-static
          wget --timeout=8 --tries=30 https://www.johnvansickle.com/ffmpeg/old-releases/${RELEASE_NAME}.tar.xz
          tar -xf ${RELEASE_NAME}.tar.xz
          mv ${RELEASE_NAME}/ffmpeg ${RELEASE_NAME}/ffprobe /usr/local/bin/
          rm -rf ${RELEASE_NAME}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install Poetry Dependencies
        run: poetry install

      - name: install flatbuffers
        run: |
          wget -O flatc https://raw.githubusercontent.com/MooncellWiki/torappu/37e645f4528248b639b63c35dbb63ee7ae64a315/bin/flatc
          chmod +x flatc

      - name: Run Download Data
        run: |
          poetry run sanity-pack download -c config.fbs.json
          poetry run sanity-pack unpack -c config.fbs.json
          poetry run sanity-pack fbs download && poetry run sanity-pack fbs decode -c config.fbs.json
          poetry run sanity-pack fbs compile -c config.fbs.json

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "update(game-data): Updated FBS"
          commit_author: "Sanity;Gone <actions@users.noreply.github.com>"
          commit_user_name: "Sanity;Gone 0"
          commit_author_email: "actions@users.noreply.github.com"